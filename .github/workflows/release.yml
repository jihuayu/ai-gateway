name: Release & Publish GHCR Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  FULL_IMAGE_NAME: ${{ github.repository }}
  NATIVE_IMAGE_NAME: ${{ github.repository }}-netty

jobs:
  build-and-release:
    name: Build Oracle GraalVM 25 Native Binary, Control-Plane JAR & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Oracle GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "gradle"

      - name: Resolve release version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify Spotless Code Formatting & Build Control-Plane Boot JAR
        run: |
          chmod +x ./gradlew
          ./gradlew spotlessCheck :gateway-control-plane:bootJar -x test --no-daemon

      - name: Build Standalone Netty Data-Plane Native Executable (Oracle GraalVM 25)
        run: ./gradlew :gateway-data-plane:nativeCompile -x test --no-daemon

      - name: Package Release Artifacts & Checksums
        run: |
          mkdir -p dist
          cp gateway-control-plane/build/libs/gateway-control-plane-*.jar "dist/ai-gateway-control-plane-${{ steps.meta.outputs.tag }}.jar"
          cp gateway-data-plane/build/native/nativeCompile/ai-gateway-netty "dist/ai-gateway-netty-linux-amd64"
          chmod +x "dist/ai-gateway-netty-linux-amd64"
          tar -czf "dist/ai-gateway-netty-${{ steps.meta.outputs.tag }}-linux-amd64.tar.gz" \
            -C dist ai-gateway-netty-linux-amd64 \
            -C "${GITHUB_WORKSPACE}" LICENSE README.md
          (cd dist && sha256sum "ai-gateway-control-plane-${{ steps.meta.outputs.tag }}.jar" "ai-gateway-netty-${{ steps.meta.outputs.tag }}-linux-amd64.tar.gz" > SHA256SUMS.txt)

      - name: Create GitHub Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "AI Gateway ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          files: |
            dist/ai-gateway-control-plane-${{ steps.meta.outputs.tag }}.jar
            dist/ai-gateway-netty-${{ steps.meta.outputs.tag }}-linux-amd64.tar.gz
            dist/SHA256SUMS.txt

  publish-ghcr:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Control-Plane / Full-Stack Image (ai-gateway)
        id: meta-full
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Control-Plane Image (ghcr.io/${{ github.repository }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full

      - name: Extract Docker metadata for Native Netty Gateway Image (ai-gateway-netty)
        id: meta-native
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NATIVE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=native

      - name: Build and push Oracle GraalVM 25 Native Gateway Image (ghcr.io/${{ github.repository }}-netty)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gateway-native
          push: true
          tags: ${{ steps.meta-native.outputs.tags }}
          labels: ${{ steps.meta-native.outputs.labels }}
          cache-from: type=gha,scope=native
          cache-to: type=gha,mode=max,scope=native
